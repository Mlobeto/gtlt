name: Deploy API

on:
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: innoprodgtltacr
  CONTAINER_APP: gtlt-api
  RESOURCE_GROUP: inno-prod-rg
  API_HEALTH_URL: https://gtlt-api.proudmoss-fef6994b.eastus2.azurecontainerapps.io/health

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image
        run: |
          az acr build \
            --registry "$ACR_NAME" \
            --image "gtlt-api:${{ github.sha }}" \
            --image gtlt-api:latest \
            ./apps/api

      - name: Update Container App
        run: |
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "${ACR_NAME}.azurecr.io/gtlt-api:${{ github.sha }}"

      - name: Smoke test /health
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "$API_HEALTH_URL" | grep -q '"ok":true'; then
              echo "Health OK"
              exit 0
            fi
            echo "Intento $i/12 — esperando arranque en frío..."
            sleep 5
          done
          echo "El /health no respondió ok en ~60s"
          exit 1
